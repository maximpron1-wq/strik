<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стрік</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Стрік">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: спокійний, тактильний, як системна апка iOS
   IDEA: скло над жаром — під склом повільно живе вогонь стріку
   PICTURE: велике кільце дня + компактні рядки звичок у скляній картці
   COLOUR and TYPE: графіт #0b0c0f, жар #ff6a3d, лід #8ccfff; Unbounded для цифр, Onest для тексту
   LAYOUT: одна колонка, плаваючий скляний док знизу, шторки замість форм */
:root{color-scheme:dark;--bg:#0b0c0f;--ink:#f1f2f5;--mute:rgba(235,238,245,.56);--faint:rgba(255,255,255,.08);--acc:#ff6a3d;--acc2:#ff9a75;--ice:#8ccfff;
  --spring:cubic-bezier(.34,1.45,.55,1);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.45 Onest,-apple-system,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:12px}
.num{font-family:Unbounded,Onest,sans-serif;font-weight:700;letter-spacing:-.02em}
[hidden]{display:none!important}

/* living background */
.bg{position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(60px);opacity:.9}
.bg i{position:absolute;border-radius:50%;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:55vmax;height:55vmax;left:-10%;top:-5%;background:radial-gradient(circle,#ff6a3d 0,transparent 65%)}
.bg i:nth-child(2){width:45vmax;height:45vmax;right:-15%;top:30%;background:radial-gradient(circle,#9a3318 0,transparent 65%);animation-duration:32s;animation-delay:-8s}
.bg i:nth-child(3){width:50vmax;height:50vmax;left:10%;bottom:-25%;background:radial-gradient(circle,#24366a 0,transparent 65%);animation-duration:38s;animation-delay:-14s}
@keyframes drift{to{transform:translate(12vw,9vh) scale(1.15)}}

/* liquid glass material */
.glass{position:relative;border-radius:28px;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 45%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 .5px rgba(255,255,255,.12),0 12px 32px rgba(0,0,0,.35)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120px 80px at var(--x,30%) var(--y,0%),rgba(255,255,255,.18),transparent 70%);mix-blend-mode:screen;transition:background .2s}
.press{transition:transform .5s var(--spring)}.press:active{transform:scale(.95)}

.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:Unbounded,sans-serif;font-weight:700;font-size:20px}.brand svg{width:28px;height:28px}
.topr{display:flex;align-items:center;gap:8px}
.lvl{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:20px}
.lvl b{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#1d0b04;display:grid;place-items:center;font:700 13px Unbounded,sans-serif}
.lvl span{font-size:13px;color:var(--mute);white-space:nowrap}
.lvl .mb{width:44px;height:4px;border-radius:4px;background:var(--faint);overflow:hidden}.lvl .mb i{display:block;height:100%;background:var(--acc);transition:width .8s var(--ease)}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.sync{width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:2px}.sync.on{background:#5fd38d}

/* hero ring */
.hero{display:flex;align-items:center;gap:18px;padding:18px;margin-bottom:14px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.09)}.ring .pr{stroke:var(--acc);transition:stroke-dashoffset 1s var(--spring)}
.ring .gl{stroke:rgba(255,106,61,.35);stroke-width:20;filter:blur(7px);transition:stroke-dashoffset 1s var(--spring)}
.ring svg{overflow:visible}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .c b{font:700 26px Unbounded,sans-serif}.ring .c small{display:block;font-size:12px;color:var(--mute);margin-top:4px}
.hero h1{margin:0;font:700 clamp(24px,7vw,30px)/1.05 Unbounded,sans-serif}
.hero .d{color:var(--mute);font-size:14px;margin-top:4px}
.hero .s{font-size:14px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.daybtns{display:flex;gap:6px;margin-top:12px}
.rb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px}

/* cards & rows */
.card{padding:6px 0;margin-bottom:14px}
.card.pad{padding:16px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px 4px;font-weight:600}
.ch small{font-weight:400;color:var(--mute);font-size:13px}
.grp{font-size:12px;color:var(--mute);padding:10px 18px 2px;font-weight:600;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 18px;min-height:62px;position:relative;cursor:pointer}
.row+.row::after{content:"";position:absolute;left:18px;right:14px;top:0;height:.5px;background:rgba(255,255,255,.09)}
.row .ri{flex:1;display:grid;gap:2px}
.row .ri b{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.row .ri small{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.row.done .ri b{color:var(--mute)}
.fl{display:inline-flex;align-items:center;gap:3px;color:var(--acc2);font-weight:600}
.iceT{color:var(--ice)}
.tick{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid rgba(255,255,255,.22);transition:background .35s var(--ease),border-color .35s,transform .5s var(--spring)}
.tick svg{width:22px;height:22px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .5s var(--spring)}
.tick[aria-pressed=true]{background:var(--acc);border-color:var(--acc);box-shadow:0 0 18px rgba(255,106,61,.55)}
.tick[aria-pressed=true] svg{opacity:1;transform:scale(1)}
.tick:active{transform:scale(.86)}
.tick.sm{width:30px;height:30px}.tick.sm svg{width:16px;height:16px}
.tring{width:44px;height:44px;flex:none;position:relative;display:grid;place-items:center;transition:transform .5s var(--spring)}.tring:active{transform:scale(.86)}
.tring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}.tring circle{fill:none;stroke-width:3.5}
.tring .ic{width:16px;height:16px}
.tring.run{background:var(--acc);border-radius:50%;color:#1d0b04;box-shadow:0 0 18px rgba(255,106,61,.55)}
.time{font:500 12px Unbounded,sans-serif;color:var(--acc2);min-width:44px;white-space:nowrap}
.more{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;color:var(--mute);font-size:14px;width:100%;text-align:left}
.ctx{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 14px 18px;margin-bottom:14px}
.ctx b{display:block}.ctx span{color:var(--mute);font-size:13px}
.pill{height:38px;padding:0 16px;border-radius:19px;background:var(--acc);color:#1d0b04;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(255,106,61,.35)}
.pill.g{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.empty{text-align:center;padding:30px 20px}.empty h2{margin:0 0 6px;font-size:20px}.empty p{color:var(--mute);margin:0 0 16px;font-size:15px}
h1.t{font:700 clamp(26px,7vw,32px)/1.05 Unbounded,sans-serif;margin:4px 0 14px}
.hint{font-size:13px;color:var(--mute);margin:0}

/* segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:16px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.seg .th{position:absolute;top:4px;bottom:4px;left:4px;border-radius:12px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 8px rgba(0,0,0,.25);transition:transform .5s var(--spring)}
.seg button{position:relative;height:36px;font-size:14px;font-weight:600;color:var(--mute);transition:color .3s}.seg button[aria-pressed=true]{color:var(--ink)}

/* week strip, kpis, heat */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:14px}
.strip button{border-radius:16px;padding:8px 0 7px;display:grid;gap:1px;justify-items:center;font-size:11px;color:var(--mute);transition:transform .5s var(--spring),background .3s}
.strip button b{font:700 16px Unbounded,sans-serif;color:var(--ink)}
.strip button[aria-current=true]{background:var(--acc);color:#1d0b04;box-shadow:0 6px 18px rgba(255,106,61,.4)}.strip button[aria-current=true] b{color:#1d0b04}
.strip i{width:5px;height:5px;border-radius:50%}.strip i.has{background:var(--mute)}.strip i.all{background:var(--acc2)}
.strip button[aria-current=true] i{background:#1d0b04}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px 0 12px}
.navrow span{color:var(--mute);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:14px 16px;border-radius:22px}.kpi .num{font-size:22px}.kpi p{margin:2px 0 0;color:var(--mute);font-size:12px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;padding:16px;overflow-x:auto;justify-content:start}
.heat i{width:13px;height:13px;border-radius:4px;background:rgba(255,255,255,.07)}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute);padding:0 18px 14px}.legend i{width:11px;height:11px;border-radius:3px}
.bar{height:5px;border-radius:5px;background:var(--faint);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:5px;transition:width .8s var(--ease)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 18px;font-size:15px}.kv span:last-child{color:var(--mute);text-align:right}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge{padding:14px;border-radius:20px;opacity:.35}.badge.got{opacity:1}.badge b{display:block;font-size:15px}.badge small{color:var(--mute);font-size:12px}
.sec{margin:22px 4px 10px;font-weight:600;font-size:17px}

/* inline add */
.inl{display:flex;gap:8px;padding:10px 14px 12px 18px}
.inl input{flex:1;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.07);padding:0 14px;font-size:16px;outline:none}
.inl input:focus{background:rgba(255,255,255,.11)}
.inl .num-in{flex:0 0 84px}
.inl button{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#1d0b04;font-size:24px;line-height:1;flex:none}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:10px;padding:0 14px;z-index:10;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;padding:5px;border-radius:32px;position:relative;width:min(380px,calc(100% - 74px))}
.tabbar .drop{position:absolute;top:5px;bottom:5px;left:0;border-radius:26px;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.3);transition:transform .6s var(--spring),width .4s var(--ease)}
.tabbar .drop.squish{animation:squish .55s var(--ease)}
@keyframes squish{30%{scale:1.22 .86}65%{scale:.95 1.05}100%{scale:1 1}}
.tabbar button{flex:1;position:relative;height:52px;border-radius:26px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mute);transition:color .3s}
.tabbar button svg{width:22px;height:22px;transition:transform .5s var(--spring)}
.tabbar button[aria-selected=true]{color:var(--acc2)}.tabbar button[aria-selected=true] svg{transform:scale(1.08)}
.plus{pointer-events:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.plus svg{width:26px;height:26px;transition:transform .5s var(--spring)}.plus:active svg{transform:rotate(90deg)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.42);opacity:0;transition:opacity .35s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:31;max-width:560px;margin:0 auto;max-height:calc(100% - 60px - env(safe-area-inset-top));overflow:auto;border-radius:34px;padding:8px 18px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(160deg,rgba(40,42,48,.82),rgba(22,23,27,.88));-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.12),0 -10px 40px rgba(0,0,0,.5);transform:translateY(110%);transition:transform .55s var(--spring);overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:4px auto 10px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh h2{margin:0;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.fld{margin-bottom:16px}.fld>label,.lab{display:block;font-size:13px;color:var(--mute);margin:0 2px 7px}
.fi{width:100%;height:50px;border:0;border-radius:16px;background:rgba(255,255,255,.08);padding:0 16px;font-size:17px;outline:none;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.fi:focus{background:rgba(255,255,255,.12)}
textarea.fi{height:auto;min-height:96px;padding:12px 16px;resize:vertical;line-height:1.45;font-size:16px}
select.fi{-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}
.chips.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.chips.days .chip{padding:0}
.chip{height:38px;padding:0 14px;border-radius:19px;background:rgba(255,255,255,.08);font-size:14px;white-space:nowrap;transition:background .25s,transform .45s var(--spring);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.chip:active{transform:scale(.93)}
.chip[aria-pressed=true]{background:var(--acc);color:#1d0b04;font-weight:600}
.chip.ice{color:var(--ice)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{min-width:74px;text-align:center;font:700 26px Unbounded,sans-serif}
.stepper button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);font-size:22px}
.big{width:100%;height:54px;border-radius:18px;background:var(--acc);color:#1d0b04;font-weight:700;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(255,106,61,.35);transition:transform .5s var(--spring)}
.big:active{transform:scale(.97)}
.big.g{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.big.danger{background:rgba(255,90,90,.12);color:#ff8a8a;box-shadow:none}
.btns{display:grid;gap:8px;margin-top:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1 1 90px;padding:12px;border-radius:18px;background:rgba(255,255,255,.07)}.stat b{font:700 20px Unbounded,sans-serif;display:block}.stat small{color:var(--mute);font-size:12px}
details.adv summary{list-style:none;cursor:pointer;color:var(--acc2);font-size:15px;padding:6px 2px 14px}details.adv summary::-webkit-details-marker{display:none}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:14px}
.moods button{height:64px;border-radius:18px;background:rgba(255,255,255,.08);display:grid;place-items:center;align-content:center;gap:2px;font-size:11px;color:var(--mute);transition:transform .5s var(--spring),background .25s}
.moods button b{font:700 19px Unbounded,sans-serif;color:var(--ink)}.moods button[aria-pressed=true]{background:var(--acc);color:#1d0b04}.moods button[aria-pressed=true] b{color:#1d0b04}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid rgba(255,255,255,.08)}.mrow:last-child{border:0}
.mrow .nm{flex:1;text-align:left;padding:8px 0;font-weight:500}
.ud{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--mute)}

/* toast, burst */
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:50;padding:11px 18px;border-radius:22px;font-weight:600;font-size:15px;white-space:nowrap;transform:translate(-50%,-140%);transition:transform .55s var(--spring);pointer-events:none}
.toast.on{transform:translate(-50%,0)}
.burst{position:fixed;z-index:40;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:var(--acc);animation:fly .65s var(--ease) forwards}
.burst i:nth-child(even){background:var(--acc2);width:5px;height:5px}
@keyframes fly{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.view.enter .stag{animation:up .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* auth */
.auth{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
.auth form{width:min(400px,100%);padding:26px 22px}
.auth .brand{font-size:28px;margin-bottom:8px}.auth .brand svg{width:42px;height:42px}
.err{color:#ff8a8a;font-size:14px;min-height:20px;margin:0 0 8px}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media(min-width:700px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.badges{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="auth" id="auth" hidden><form class="glass" id="authForm" novalidate>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true" id="logoA"></svg>Стрік</div>
  <p class="hint" style="font-size:15px;margin:0 0 18px">Увійди акаунтом My Orders. Звички, план і цілі синхронізуються між пристроями.</p>
  <div class="fld"><label for="aEmail">Email</label><input class="fi" id="aEmail" type="email" autocomplete="email" inputmode="email" placeholder="name@gmail.com"></div>
  <div class="fld"><label for="aPass">Пароль</label><input class="fi" id="aPass" type="password" autocomplete="current-password"></div>
  <p class="err" id="aErr"></p>
  <button class="big" type="submit" id="aBtn">Увійти</button>
</form></div>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true" id="logoH"></svg>Стрік</div>
    <div class="topr">
      <button class="lvl glass press" data-a="tab" data-v="stats" aria-label="Рівень і прогрес"><b id="lvl">1</b><span id="lvlT">Новачок</span><span class="mb"><i id="xpbar" style="width:0"></i></span></button>
      <button class="gear glass press" data-a="settings" aria-label="Налаштування"><span class="sync" id="sync"></span></button>
    </div>
  </header>
  <main>
    <section class="view" id="v-today"></section>
    <section class="view" id="v-plan" hidden></section>
    <section class="view" id="v-goals" hidden></section>
    <section class="view" id="v-stats" hidden></section>
  </main>
</div>

<nav class="dock">
  <div class="tabbar glass" role="tablist" id="tabbar">
    <span class="drop" id="drop"></span>
    <button role="tab" data-a="tab" data-v="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>Сьогодні</button>
    <button role="tab" data-a="tab" data-v="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>План</button>
    <button role="tab" data-a="tab" data-v="goals" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor"/></svg>Цілі</button>
    <button role="tab" data-a="tab" data-v="stats" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Прогрес</button>
  </div>
  <button class="plus glass press" data-a="add" aria-label="Додати"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</nav>

<div class="scrim" id="scrim" data-a="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab" id="grab"></div><div id="sheetBody"></div></div>
<div class="toast glass" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const CELLS='<rect x="4" y="44" width="16" height="16" rx="4" fill="#5a2a1c"/><rect x="24" y="44" width="16" height="16" rx="4" fill="#a8442a"/><rect x="44" y="44" width="16" height="16" rx="4" fill="#ff6a3d"/><rect x="4" y="24" width="16" height="16" rx="4" fill="#2a2d35"/><rect x="24" y="24" width="16" height="16" rx="4" fill="#a8442a"/><rect x="44" y="24" width="16" height="16" rx="4" fill="#ff6a3d"/><rect x="4" y="4" width="16" height="16" rx="4" fill="#2a2d35"/><rect x="24" y="4" width="16" height="16" rx="4" fill="#2a2d35"/><rect x="44" y="4" width="16" height="16" rx="4" fill="#ff6a3d"/>';
$('logoA').innerHTML=CELLS;$('logoH').innerHTML=CELLS;
const I={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="#1d0b04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 flame:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 11 11c0-4 1-9 1-9z"/></svg>',
 snow:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>',
 play:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
 pause:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 chev:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
 gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'};
document.querySelector('.gear').insertAdjacentHTML('afterbegin',I.gear);
const SPHERES={body:'Тіло і здоров’я',work:'Робота і проєкти',grow:'Саморозвиток',quit:'Відмова від шкідливого'};
const TYPES={check:'Так / ні',timer:'Таймер',quit:'Відмова'};
const PARTS={morning:'Ранок',day:'День',evening:'Вечір',any:'Будь-коли'};
const THINTS={check:'Одне натискання: зробив чи ні.',timer:'Запускаєш таймер або додаєш хвилини. Виконано, коли набрав ціль.',quit:'Відмічаєш «чистий» день. Стрік = скільки днів тримаєшся.'};
const DOW=[1,2,3,4,5,6,0],DN=['Нд','Пн','Вт','Ср','Чт','Пт','Сб'],DFULL=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const MON=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MNOM=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const MOODS=['Важкий','Так собі','Норм','Добрий','Вогонь'];
const PRESETS=[['Тренування','body','check',0,'morning'],['Сон до 23:00','body','check',0,'evening'],['Глибока робота','work','timer',90,'day'],['Монтаж','work','timer',60,'day'],['Читання','grow','timer',20,'evening'],['Англійська','grow','timer',15,'any'],['Без соцмереж до 12:00','quit','quit',0,'morning'],['Без солодкого','quit','quit',0,'any']];
const LEVELS=['Новачок','Учень','Практик','Стабільний','Дисциплінований','Майстер','Машина','Легенда'];
const TIMES=['09:00','12:00','15:00','18:00','21:00'];

const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const add=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return key(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>key(new Date());
const wk=k=>add(k,-((parse(k).getDay()+6)%7));
const mAdd=(m,n)=>key(new Date(+m.slice(0,4),+m.slice(5)-1+n,1)).slice(0,7);
const wLabel=w=>{const a=parse(w),b=parse(add(w,6));return a.getMonth()===b.getMonth()?a.getDate()+'–'+b.getDate()+' '+MON[a.getMonth()]:a.getDate()+' '+MON[a.getMonth()]+' – '+b.getDate()+' '+MON[b.getMonth()]};
const mLabel=m=>MNOM[+m.slice(5)-1]+' '+m.slice(0,4);
const wMonth=w=>add(w,3).slice(0,7);
const dayName=k=>{const t=today();return k===t?'Сьогодні':k===add(t,-1)?'Вчора':k===add(t,1)?'Завтра':DFULL[parse(k).getDay()].replace(/^./,c=>c.toUpperCase())};
const dLabel=k=>{const d=parse(k);return d.getDate()+' '+MON[d.getMonth()]+', '+DFULL[d.getDay()]};

/* ---------- state ---------- */
const BLANK=()=>({habits:[],log:{},frozen:{},timer:null,fpm:3,goals:[],plan:{},days:{},reviews:{},rewards:[],spent:[],updated:0});
function norm(d){const o=Object.assign(BLANK(),JSON.parse(JSON.stringify(d||{})));for(const h of o.habits){h.part=h.part||'any';h.days=h.days||[0,1,2,3,4,5,6];h.target=h.target||30;h.sphere=h.sphere||'body'}return o}
let S=BLANK();try{const l=JSON.parse(localStorage.getItem('ht-state'));if(l&&l.habits)S=norm(l)}catch(e){}
let view='today',day=today(),gscope='week',gw=wk(today()),gm=today().slice(0,7),rw=wk(today()),remote=()=>{},logout=()=>{};

const H=id=>S.habits.find(h=>h.id===id);
const val=(h,k)=>S.log[k]?.[h.id];
const isDone=(h,k)=>{const v=val(h,k);return h.type==='timer'?(v||0)>=h.target:v===true};
const isFz=(h,k)=>!!S.frozen[k]?.[h.id];
const sched=(h,k)=>k>=h.created&&h.days.includes(parse(k).getDay());
const planOf=k=>(S.plan[k]||[]).slice().sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0);
function streak(h){let k=today(),n=0;if(!isDone(h,k))k=add(k,-1);for(let i=0;i<800&&k>=h.created;i++,k=add(k,-1)){if(!sched(h,k))continue;if(isDone(h,k))n++;else if(!isFz(h,k))break}return n}
function best(h){let b=0,n=0;for(let k=h.created,t=today();k<=t;k=add(k,1)){if(!sched(h,k))continue;if(isDone(h,k)){n++;b=Math.max(b,n)}else if(!isFz(h,k)&&k!==t)n=0}return b}
function fzUsed(m){let n=0;for(const k in S.frozen)if(k.startsWith(m))n+=Object.keys(S.frozen[k]).length;return n}
function totals(){let xp=0,checks=0,mins=0,goals=0,plans=0;
  for(const k in S.log)for(const id in S.log[k]){const h=H(id);if(!h)continue;const v=S.log[k][id];if(h.type==='timer'){mins+=v||0;xp+=Math.min(v||0,h.target*2);if(v>=h.target){xp+=10;checks++}}else if(v===true){xp+=10;checks++}}
  for(const h of S.habits){const b=best(h);xp+=b>=7?30:0;xp+=b>=30?100:0}
  for(const g of S.goals)if(g.done){goals++;xp+=g.scope==='week'?25:50}
  for(const k in S.plan)for(const t of S.plan[k])if(t.done){plans++;xp+=5}
  const spent=S.spent.reduce((a,s)=>a+s.cost,0);return{xp,checks,mins,goals,plans,bal:xp-spent}}
function level(xp){let L=1,need=100;while(xp>=need){xp-=need;L++;need=Math.round(need*1.25)}return{L,cur:xp,need}}
function persist(){S.updated=Date.now();try{localStorage.setItem('ht-state',JSON.stringify(S))}catch(e){}remote()}
function save(){persist();render();if(sheetRefresh)sheetRefresh()}
function setSync(on){$('sync').classList.toggle('on',on)}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}
function burst(el){if(matchMedia('(prefers-reduced-motion: reduce)').matches||!el)return;const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='burst';b.style.left=r.left+r.width/2+'px';b.style.top=r.top+r.height/2+'px';
  b.innerHTML=Array.from({length:10},(_,i)=>{const a=i/10*Math.PI*2,d=34+Math.random()*16;return `<i style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px"></i>`}).join('');document.body.appendChild(b);setTimeout(()=>b.remove(),700)}
function xpToast(gain,before){const n=level(totals().xp).L;toast(n>before?'Новий рівень: '+n+' · '+LEVELS[Math.min(7,n-1)]:'+'+gain+' XP')}

/* ---------- actions ---------- */
function setLog(h,k,v){S.log[k]=S.log[k]||{};if(v===undefined||v===0||v===false)delete S.log[k][h.id];else S.log[k][h.id]=v;if(!Object.keys(S.log[k]).length)delete S.log[k]}
function toggle(id,el){const h=H(id),was=isDone(h,day),lv=level(totals().xp).L;setLog(h,day,was?undefined:true);if(!was&&isFz(h,day))delete S.frozen[day][h.id];if(!was)burst(el);save();if(!was)xpToast(10,lv)}
function addMin(id,m){const h=H(id),b=isDone(h,day),lv=level(totals().xp).L;setLog(h,day,Math.max(0,(val(h,day)||0)+m));save();if(!b&&isDone(h,day))xpToast(10,lv)}
function timer(id){const t=S.timer;const fin=()=>{const m=Math.max(1,Math.round((Date.now()-t.start)/60000)),h=H(t.hid);if(h){S.log[t.day]=S.log[t.day]||{};S.log[t.day][h.id]=(S.log[t.day][h.id]||0)+m}return m};
  if(t&&t.hid===id){const m=fin();S.timer=null;save();toast('+'+m+' хв');return}if(t)fin();S.timer={hid:id,start:Date.now(),day};save()}
function freeze(id){const m=day.slice(0,7);if(isFz(H(id),day)){delete S.frozen[day][id];if(!Object.keys(S.frozen[day]).length)delete S.frozen[day];save();return}
  if(fzUsed(m)>=S.fpm){toast('Заморозки на місяць закінчились');return}S.frozen[day]=S.frozen[day]||{};S.frozen[day][id]=true;save();toast('Стрік заморожено')}
function ptog(k,id,el){const t=S.plan[k].find(x=>x.id===id),lv=level(totals().xp).L;t.done=!t.done;if(t.done)burst(el);save();if(t.done)xpToast(5,lv)}
function gtog(id,el){const g=S.goals.find(x=>x.id===id),lv=level(totals().xp).L;g.done=!g.done;if(g.done)burst(el);save();if(g.done)xpToast(g.scope==='week'?25:50,lv)}
const fmtT=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ---------- today ---------- */
function habitRow(h,i){const d=isDone(h,day),fz=isFz(h,day),st=streak(h),v=val(h,day)||0,run=S.timer&&S.timer.hid===h.id;
  const sub=[st?`<span class="fl">${I.flame}${st}</span>`:'',h.type==='timer'?(run?`<span class="fl" data-run>${fmtT(Date.now()-S.timer.start)}</span>`:`<span>${v} / ${h.target} хв</span>`):'',h.type==='quit'&&!st?'<span>чистих днів: 0</span>':'',fz?`<span class="iceT">${I.snow} заморожено</span>`:''].filter(Boolean).join('');
  let right;if(h.type==='timer'){const C=2*Math.PI*19,p=Math.min(1,v/h.target);
    right=`<button class="tring${run?' run':''}" data-a="timer" data-id="${h.id}" aria-label="${run?'Зупинити':'Запустити'} таймер ${esc(h.name)}">${run?'':`<svg class="r" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" stroke="rgba(255,255,255,.16)"/><circle cx="22" cy="22" r="19" stroke="${d?'#ff6a3d':'#ff9a75'}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}${run?I.pause:d?I.check.replace('#1d0b04','#ff9a75'):I.play}</button>`}
  else right=`<button class="tick" data-a="tog" data-id="${h.id}" aria-pressed="${d}" aria-label="${esc(h.name)}">${I.check}</button>`;
  return `<div class="row stag${d?' done':''}" style="--i:${i}" data-a="hsheet" data-id="${h.id}"><div class="ri"><b>${esc(h.name)}</b>${sub?`<small>${sub}</small>`:''}</div>${right}</div>`}
function taskRow(t,k,i){return `<div class="row stag${t.done?' done':''}" style="--i:${i}" data-a="tsheet" data-k="${k}" data-id="${t.id}"><span class="time">${t.time||'—'}</span><div class="ri"><b>${esc(t.title)}</b></div><button class="tick sm" data-a="ptog" data-k="${k}" data-id="${t.id}" aria-pressed="${!!t.done}" aria-label="${esc(t.title)}">${I.check}</button></div>`}
function ctxCard(){if(day!==today()||!S.habits.length)return '';const now=new Date(),hr=now.getHours(),dow=now.getDay();
  if((dow===0&&hr>=17)||(dow===1&&hr<12&&!S.reviews[add(wk(day),-7)]))return `<div class="ctx glass stag" style="--i:1"><div><b>Підсумок тижня</b><span>Хвилина на огляд, і наступний буде кращим</span></div><button class="pill press" data-a="review">Відкрити</button></div>`;
  if(hr>=18&&!S.days[day]?.mood)return `<div class="ctx glass stag" style="--i:1"><div><b>Закрий день</b><span>Оціни настрій і запиши пару слів</span></div><button class="pill press" data-a="daysheet">Оцінити</button></div>`;
  return ''}
function renderToday(){const t=today(),list=S.habits.filter(h=>sched(h,day)),dn=list.filter(h=>isDone(h,day)).length,C=2*Math.PI*52,p=list.length?dn/list.length:0;
  const bestSt=Math.max(0,...S.habits.map(streak)),mood=S.days[day]?.mood;
  const status=!S.habits.length?'Додай першу звичку':!list.length?'Сьогодні звичок немає':dn===list.length?'День закрито. Так тримати':'Лишилось '+(list.length-dn);
  let h=`<div class="hero glass stag"><div class="ring"><svg viewBox="0 0 118 118"><circle class="tr" cx="59" cy="59" r="52"/><circle class="gl" cx="59" cy="59" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/><circle class="pr" cx="59" cy="59" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg><div class="c"><div><b>${dn}/${list.length}</b><small>звичок</small></div></div></div>
   <div style="flex:1"><h1>${dayName(day)}</h1><div class="d">${dLabel(day)}</div><div class="s"><span>${status}</span>${bestSt?`<span class="fl">${I.flame}${bestSt}</span>`:''}${mood?`<button class="chip" style="height:28px;padding:0 10px;font-size:12px" data-a="daysheet">Настрій ${mood} · ${MOODS[mood-1]}</button>`:''}</div>
   <div class="daybtns"><button class="rb glass press" data-a="dnav" data-n="-1" aria-label="Попередній день">‹</button><button class="rb glass press" data-a="dnav" data-n="1" aria-label="Наступний день" ${day>=t?'disabled':''}>›</button>${day!==t?`<button class="pill g press" data-a="dtoday" style="height:38px">Сьогодні</button>`:''}</div></div></div>`;
  h+=ctxCard();
  if(!S.habits.length)h+=`<div class="glass empty stag" style="--i:2"><h2>Почнімо з першої звички</h2><p>Додай 2–3 звички. Коли стануть автоматичними, додаси ще.</p><button class="pill press" data-a="add" data-m="habit">Додати звичку</button></div>`;
  else if(list.length){const groups=Object.keys(PARTS).map(p=>[p,list.filter(x=>x.part===p)]).filter(g=>g[1].length),multi=groups.length>1;let i=2;
    h+=`<div class="glass card">${groups.map(([p,L])=>(multi?`<div class="grp">${PARTS[p]}</div>`:'')+L.map(x=>habitRow(x,i++)).join('')).join('')}</div>`}
  const L=planOf(day),pd=L.filter(x=>x.done).length,show=[...L.filter(x=>!x.done),...L.filter(x=>x.done)].slice(0,4);
  h+=`<div class="glass card stag" style="--i:6"><div class="ch">План на день<small>${L.length?pd+' з '+L.length:''}</small></div>${show.map((x,i)=>taskRow(x,day,7+i)).join('')}
    ${L.length>4?`<button class="more" data-a="tab" data-v="plan"><span>Ще ${L.length-4}</span>${I.chev}</button>`:''}${inl('plan','Додати задачу')}</div>`;
  const wg=S.goals.filter(g=>g.scope==='week'&&g.period===wk(t));
  if(wg.length)h+=`<button class="glass more stag" style="--i:8;border-radius:22px;padding:15px 18px" data-a="tab" data-v="goals"><span>Цілі тижня · ${wg.filter(g=>g.done).length} з ${wg.length}</span>${I.chev}</button>`;
  $('v-today').innerHTML=h}
const inl=(kind,ph,cost)=>`<form class="inl" data-kind="${kind}" autocomplete="off"><input placeholder="${ph}" maxlength="120" aria-label="${ph}" enterkeyhint="done">${cost?'<input class="num-in" type="number" inputmode="numeric" placeholder="XP" aria-label="Ціна в XP">':''}<button type="submit" aria-label="Додати">+</button></form>`;

/* ---------- plan ---------- */
function renderPlan(){const w=wk(day),t=today(),L=planOf(day),dn=L.filter(x=>x.done).length,left=(S.plan[add(day,-1)]||[]).filter(x=>!x.done).length;
  $('v-plan').innerHTML=`<h1 class="t stag">План</h1>
  <div class="navrow stag" style="--i:1"><button class="rb glass press" data-a="pnav" data-n="-7" aria-label="Попередній тиждень">‹</button><span>${wLabel(w)}</span><button class="rb glass press" data-a="pnav" data-n="7" aria-label="Наступний тиждень">›</button></div>

  b+=`<div class="fld"><label for="hName">Назва</label><input class="fi" id="hName" data-id="${id}" value="${esc(h.name)}" maxlength="60"></div>
   <div class="fld"><span class="lab">Як відмічати</span>${segset('hset',Object.entries(TYPES),h.type,`data-k="type" data-id="${id}"`)}</div>
   ${h.type==='timer'?`<div class="fld"><span class="lab">Ціль на день</span><div class="stepper"><button data-a="htgt" data-id="${id}" data-n="-5" aria-label="Менше">−</button><b>${h.target}</b><span class="hint">хв</span><button data-a="htgt" data-id="${id}" data-n="5" aria-label="Більше">+</button></div></div>`:''}
   <div class="fld"><span class="lab">Час дня</span>${chipset('hset',Object.entries(PARTS),h.part,`data-k="part" data-id="${id}"`)}</div>
   <div class="fld"><span class="lab">Сфера</span>${chipset('hset',Object.entries(SPHERES),h.sphere,`data-k="sphere" data-id="${id}"`)}</div>
   <div class="fld"><span class="lab">Дні</span>${chipset('hday',DOW.map(x=>[x,DN[x]]),h.days,`data-id="${id}"`,'days')}</div>
   <button class="big danger" data-a="hdel" data-id="${id}" id="hdel">Видалити звичку</button><p class="hint" style="text-align:center;margin-top:8px">Зміни зберігаються одразу</p>`;return b}
/* task / goal / reward sheets */
function taskBody(k,id){const t=(S.plan[k]||[]).find(x=>x.id===id);if(!t)return sh('Задачу видалено');
  return sh('Задача')+`<div class="fld"><input class="fi" id="tTitle" value="${esc(t.title)}" maxlength="120" aria-label="Задача"></div>
   <div class="fld"><span class="lab">${dayName(k)} · час</span><div class="chips">${[['','Без часу'],...TIMES.map(x=>[x,x])].map(([v,l])=>`<button class="chip" data-a="tset" data-v="${v}" aria-pressed="${(t.time||'')===v}">${l}</button>`).join('')}<input class="chip" type="time" id="tTime" value="${t.time&&!TIMES.includes(t.time)?t.time:''}" aria-label="Свій час" style="width:110px;border:0"></div></div>
   <div class="btns"><button class="big${t.done?' g':''}" data-a="ptog" data-k="${k}" data-id="${id}">${t.done?'Повернути в роботу':'Зроблено'}</button><button class="big g" data-a="tmove" data-n="1">Перенести на наступний день</button><button class="big danger" data-a="tdel" id="tdel">Видалити</button></div>`}
function goalBody(id){const g=S.goals.find(x=>x.id===id);if(!g)return sh('Ціль видалено');const mo=g.scope==='week'?S.goals.filter(x=>x.scope==='month'&&x.period===wMonth(g.period)):[],kids=g.scope==='month'?S.goals.filter(x=>x.parent===g.id):[];
  return sh(g.scope==='week'?'Завдання тижня':'Ціль місяця')+`<div class="fld"><input class="fi" id="gTitle" value="${esc(g.title)}" maxlength="120" aria-label="Назва"></div>
   ${mo.length?`<div class="fld"><span class="lab">Крок до місячної цілі</span><select class="fi" id="gParent"><option value="">Без прив’язки</option>${mo.map(x=>`<option value="${x.id}"${g.parent===x.id?' selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`:''}
   ${kids.length?`<div class="fld"><span class="lab">Кроки</span>${kids.map(x=>`<div class="mrow"><span class="nm">${esc(x.title)}</span><button class="tick sm" data-a="gtog" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="${esc(x.title)}">${I.check}</button></div>`).join('')}</div>`:''}
   <div class="btns"><button class="big${g.done?' g':''}" data-a="gtog" data-id="${id}">${g.done?'Повернути в роботу':'Виконано'}</button><button class="big g" data-a="gmove">На наступний ${g.scope==='week'?'тиждень':'місяць'}</button><button class="big danger" data-a="gdel" id="gdel">Видалити</button></div>`}
function rewardBody(id){const r=S.rewards.find(x=>x.id===id);if(!r)return sh('Видалено');
  return sh('Нагорода')+`<div class="fld"><input class="fi" id="rTitle" value="${esc(r.title)}" maxlength="80" aria-label="Назва"></div><div class="fld"><label for="rCost">Ціна, XP</label><input class="fi" id="rCost" type="number" inputmode="numeric" value="${r.cost}"></div><button class="big danger" data-a="rdel" id="rdel">Видалити</button>`}
function dayBody(){const m=S.days[day]||{};return sh(dayName(day)+': як пройшов день?')+`<div class="moods">${MOODS.map((t,i)=>`<button data-a="mood" data-n="${i+1}" aria-pressed="${m.mood===i+1}" aria-label="${t}"><b>${i+1}</b>${t}</button>`).join('')}</div>
  <div class="fld"><textarea class="fi" id="dnote" placeholder="Що вдалося, що заважало, що зробиш інакше завтра" maxlength="2000">${esc(m.note||'')}</textarea></div><button class="big" data-a="close">Готово</button>`}
function settingsBody(){return sh('Налаштування')+`<div class="fld"><span class="lab">Мої звички · тапни, щоб змінити</span>${S.habits.map((h,i)=>`<div class="mrow"><button class="nm" data-a="hsheet" data-id="${h.id}">${esc(h.name)}</button><button class="ud" data-a="hmove" data-id="${h.id}" data-n="-1" ${i?'':'disabled'} aria-label="Вище">↑</button><button class="ud" data-a="hmove" data-id="${h.id}" data-n="1" ${i<S.habits.length-1?'':'disabled'} aria-label="Нижче">↓</button></div>`).join('')||'<p class="hint">Ще немає звичок.</p>'}</div>
  <div class="fld"><span class="lab">Заморозок стріку на місяць</span><div class="stepper"><button data-a="fpm" data-n="-1" aria-label="Менше">−</button><b>${S.fpm}</b><button data-a="fpm" data-n="1" aria-label="Більше">+</button></div></div>
  <div class="fld"><span class="lab">Акаунт</span><div class="mrow"><span class="nm" id="whoami">${esc(window._email||'')}</span></div></div><button class="big danger" data-a="logout">Вийти</button>`}

let ctx={};
const openHabit=id=>{ctx={id};openSheet(()=>habitBody(id))};
function confirm2(btn,label,fn){if(btn.dataset.sure){fn();return}btn.dataset.sure=1;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure}},3000)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,id=b.dataset.id,n=+b.dataset.n,v=b.dataset.v;
  if(a!=='adv')e.preventDefault();
  const act={
   tab:()=>setView(v),add:()=>openAdd(b.dataset.m),close:closeSheet,settings:()=>openSheet(settingsBody),
   tog:()=>toggle(id,b),timer:()=>timer(id),hsheet:()=>openHabit(id),hmin:()=>addMin(id,n),fz:()=>freeze(id),
   dnav:()=>{const x=add(day,n);if(x<=today()){day=x;render()}},dtoday:()=>{day=today();render()},
   pnav:()=>{day=add(day,n);render()},pick:()=>{day=b.dataset.k;render()},
   ptog:()=>ptog(b.dataset.k,id,b),tsheet:()=>{ctx={k:b.dataset.k,id};openSheet(()=>taskBody(ctx.k,ctx.id))},
   pcarry:()=>{const y=add(day,-1),L=(S.plan[y]||[]).filter(t=>!t.done);S.plan[y]=(S.plan[y]||[]).filter(t=>t.done);if(!S.plan[y].length)delete S.plan[y];(S.plan[day]=S.plan[day]||[]).push(...L);save();toast('Перенесено: '+L.length)},
   gscope:()=>{gscope=v;render()},gnav:()=>{if(gscope==='week')gw=add(gw,7*n);else gm=mAdd(gm,n);render()},
   gtog:()=>gtog(id,b),gsheet:()=>{ctx={id};openSheet(()=>goalBody(ctx.id))},
   gcarry:()=>{const per=gscope==='week'?gw:gm,prev=gscope==='week'?add(per,-7):mAdd(per,-1);let c=0;for(const g of S.goals)if(g.scope===gscope&&g.period===prev&&!g.done){g.period=per;c++}save();toast('Перенесено: '+c)},
   gmove:()=>{const g=S.goals.find(x=>x.id===ctx.id);g.period=g.scope==='week'?add(g.period,7):mAdd(g.period,1);closeSheet();save();toast('Перенесено')},
   gdel:()=>confirm2(b,'Точно видалити?',()=>{S.goals=S.goals.filter(x=>x.id!==ctx.id);for(const x of S.goals)if(x.parent===ctx.id)x.parent='';closeSheet();save();toast('Видалено')}),
   rbuy:()=>{const r=S.rewards.find(x=>x.id===id);if(totals().bal<r.cost)return;S.spent.push({id:uid(),title:r.title,cost:r.cost,date:today()});burst(b);save();toast('Заслужив: '+r.title)},
   rsheet:()=>{ctx={id};openSheet(()=>rewardBody(ctx.id))},rdel:()=>confirm2(b,'Точно видалити?',()=>{S.rewards=S.rewards.filter(x=>x.id!==ctx.id);closeSheet();save()}),
   rnav:()=>{const x=add(rw,n);if(x<=wk(today())){rw=x;render()}},review:()=>{rw=new Date().getDay()===1?add(wk(today()),-7):wk(today());setView('stats')},
   daysheet:()=>openSheet(dayBody),mood:()=>{const m=S.days[day]=S.days[day]||{};m.mood=m.mood===n?undefined:n;if(!m.mood&&!m.note)delete S.days[day];save()},
   amode:()=>{A.title=$('aTitle')?.value||A.title;A.mode=v;sheetRefresh()},
   aset:()=>{A.title=$('aTitle')?.value||A.title;A[b.dataset.k]=v;if(b.dataset.k==='type'&&v==='quit')A.sphere='quit';sheetRefresh()},
   aday:()=>{const d=+v;A.days=A.days.includes(d)?A.days.filter(x=>x!==d):[...A.days,d];sheetRefresh()},
   atgt:()=>{A.title=$('aTitle')?.value||A.title;A.target=Math.min(600,Math.max(5,A.target+n));sheetRefresh()},
   adv:()=>{A.adv=!A.adv;A.title=$('aTitle')?.value||A.title},
   preset:()=>{const p=PRESETS[b.dataset.p];Object.assign(A,{title:p[0],sphere:p[1],type:p[2],part:p[4]});if(p[3])A.target=p[3];sheetRefresh()},
   addgo:addGo,
   hset:()=>{const h=H(id);h[b.dataset.k]=v;if(b.dataset.k==='type'&&v==='quit')h.sphere='quit';save()},
   hday:()=>{const h=H(id),d=+v;if(h.days.includes(d)&&h.days.length===1){toast('Залиш хоча б один день');return}h.days=h.days.includes(d)?h.days.filter(x=>x!==d):[...h.days,d];save()},
   htgt:()=>{const h=H(id);h.target=Math.min(600,Math.max(5,h.target+n));save()},
   hdel:()=>confirm2(b,'Точно видалити? Історію буде втрачено',()=>{S.habits=S.habits.filter(h=>h.id!==id);if(S.timer?.hid===id)S.timer=null;closeSheet();save();toast('Звичку видалено')}),
   hmove:()=>{const i=S.habits.findIndex(h=>h.id===id),j=i+n;if(j<0||j>=S.habits.length)return;[S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];save()},
   fpm:()=>{S.fpm=Math.min(10,Math.max(0,S.fpm+n));save()},
   tset:()=>{const t=S.plan[ctx.k].find(x=>x.id===ctx.id);t.time=v;save()},
   tmove:()=>{const L=S.plan[ctx.k],t=L.find(x=>x.id===ctx.id);S.plan[ctx.k]=L.filter(x=>x!==t);if(!S.plan[ctx.k].length)delete S.plan[ctx.k];const nk=add(ctx.k,1);(S.plan[nk]=S.plan[nk]||[]).push(t);closeSheet();save();toast('Перенесено на '+dayName(nk).toLowerCase())},
   tdel:()=>confirm2(b,'Точно видалити?',()=>{S.plan[ctx.k]=S.plan[ctx.k].filter(x=>x.id!==ctx.id);if(!S.plan[ctx.k].length)delete S.plan[ctx.k];closeSheet();save()}),
   logout:()=>{closeSheet();logout()}}[a];
  if(act)act()});

let typeT;
document.addEventListener('input',e=>{const t=e.target,v=t.value;
  if(t.id==='hName'){const h=H(t.dataset.id);if(h&&v.trim()){h.name=v.trim();clearTimeout(typeT);typeT=setTimeout(()=>{persist();render()},300)}}
  else if(t.id==='tTitle'){const x=S.plan[ctx.k]?.find(y=>y.id===ctx.id);if(x&&v.trim()){x.title=v.trim();clearTimeout(typeT);typeT=setTimeout(()=>{persist();render()},300)}}
  else if(t.id==='gTitle'){const g=S.goals.find(y=>y.id===ctx.id);if(g&&v.trim()){g.title=v.trim();clearTimeout(typeT);typeT=setTimeout(()=>{persist();render()},300)}}
  else if(t.id==='rTitle'||t.id==='rCost'){const r=S.rewards.find(y=>y.id===ctx.id);if(r){if(t.id==='rTitle'&&v.trim())r.title=v.trim();if(t.id==='rCost'&&+v>0)r.cost=Math.round(+v);clearTimeout(typeT);typeT=setTimeout(()=>{persist();render()},300)}}
  else if(t.id==='dnote'){const m=S.days[day]=S.days[day]||{};m.note=v;persist()}
  else if(t.id==='rnote'){S.reviews[rw]=v;persist()}
  else if(t.id==='aTitle')A.title=v});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='tTime'&&t.value){const x=S.plan[ctx.k].find(y=>y.id===ctx.id);x.time=t.value;save()}
  else if(t.id==='aTime'&&t.value){A.title=$('aTitle')?.value||A.title;A.ttime=t.value;sheetRefresh()}
  else if(t.id==='gParent'){const g=S.goals.find(y=>y.id===ctx.id);g.parent=t.value;save()}
  else if(t.id==='aParent')A.parent=t.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('on'))closeSheet();if(e.key==='Enter'&&e.target.id==='aTitle'){e.preventDefault();addGo()}});
document.addEventListener('submit',e=>{const f=e.target.closest('.inl');if(!f)return;e.preventDefault();const ins=f.querySelectorAll('input'),txt=ins[0].value.trim(),kind=f.dataset.kind;if(!txt)return;
  if(kind==='plan')(S.plan[day]=S.plan[day]||[]).push({id:uid(),title:txt,time:'',done:false});
  else if(kind==='goal')S.goals.push({id:uid(),scope:gscope,period:gscope==='week'?gw:gm,title:txt,done:false,parent:''});
  else{const c=Math.round(+ins[1].value);if(!(c>0)){toast('Вкажи ціну в XP');ins[1].focus();return}S.rewards.push({id:uid(),title:txt,cost:c})}
  ins.forEach(i=>i.value='');save();const nf=document.querySelector(`#v-${view} .inl[data-kind="${kind}"] input`);if(nf){nf.value='';nf.focus()}});
/* light follows finger on glass */
document.addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--x',(e.clientX-r.left)+'px');g.style.setProperty('--y',(e.clientY-r.top)+'px')},{passive:true});
/* swipe sheet down */
{let y0=null,dy=0;const sh=$('sheet');
 sh.addEventListener('touchstart',e=>{if(sh.scrollTop>0&&!e.target.closest('#grab,.sh'))return;y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});
 sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transform=`translateY(${dy}px)`},{passive:true});
 sh.addEventListener('touchend',()=>{if(y0===null)return;sh.style.transition='';y0=null;if(dy>110)closeSheet();else sh.style.transform=''})}
addEventListener('resize',()=>moveDrop(false));
setInterval(()=>{const el=document.querySelector('[data-run]');if(el&&S.timer)el.textContent=fmtT(Date.now()-S.timer.start)},1000);
let lastDay=today();setInterval(()=>{if(today()!==lastDay){if(day===lastDay)day=today();lastDay=today();render()}},60000);
setView('today');requestAnimationFrame(()=>moveDrop(false));if(document.fonts)document.fonts.ready.then(()=>moveDrop(false));

/* ---------- Supabase ---------- */
if(window.supabase){
const SB=supabase.createClient('https://sxyvmzxztmiyaspkhsoz.supabase.co','sb_publishable_bDHFlu3QpXKH7XsX1XDxpA_N4AUW7o3',{auth:{persistSession:true}});
let uidv=null,chan=null,pushing=0,saveT=null;
async function pull(){const{data,error}=await SB.from('strik_state').select('data').eq('user_id',uidv).maybeSingle();if(error){setSync(false);return}
  const d=data&&data.data&&data.data.habits?norm(data.data):null;
  if(d&&(d.updated||0)>=(S.updated||0)){S=d;try{localStorage.setItem('ht-state',JSON.stringify(S))}catch(e){}render()}else if(!d||(S.updated||0)>(d.updated||0))await push();setSync(true)}
async function push(){if(!uidv)return;pushing++;const{error}=await SB.from('strik_state').upsert({user_id:uidv,data:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});pushing--;setSync(!error)}
remote=()=>{clearTimeout(saveT);saveT=setTimeout(push,500)};
async function start(session){uidv=session.user.id;window._email=session.user.email;$('auth').hidden=true;
  try{const last=localStorage.getItem('ht-user');if(last&&last!==uidv){S=BLANK();render()}localStorage.setItem('ht-user',uidv)}catch(e){}
  await pull();
  if(chan)SB.removeChannel(chan);chan=SB.channel('strik-'+uidv).on('postgres_changes',{event:'*',schema:'public',table:'strik_state',filter:'user_id=eq.'+uidv},p=>{const d=p.new&&p.new.data;if(d&&d.habits&&(d.updated||0)>(S.updated||0)){S=norm(d);try{localStorage.setItem('ht-state',JSON.stringify(S))}catch(e){}render();if(sheetRefresh)sheetRefresh()}}).subscribe()}
function showAuth(){uidv=null;$('auth').hidden=false;setSync(false)}
$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('aEmail').value.trim(),password=$('aPass').value;$('aErr').textContent='';
  if(!email||!password){$('aErr').textContent='Введи email і пароль';return}$('aBtn').disabled=true;$('aBtn').textContent='Входжу…';
  const{data,error}=await SB.auth.signInWithPassword({email,password});$('aBtn').disabled=false;$('aBtn').textContent='Увійти';
  if(error){$('aErr').textContent=/invalid/i.test(error.message)?'Невірний email або пароль':'Не вдалося увійти. Спробуй ще раз.';return}$('aPass').value='';start(data.session)};
logout=async()=>{await SB.auth.signOut();if(chan)SB.removeChannel(chan);chan=null;S=BLANK();try{localStorage.removeItem('ht-state');localStorage.removeItem('ht-user')}catch(e){}render();showAuth()};
SB.auth.getSession().then(({data})=>data.session?start(data.session):showAuth());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&uidv&&!pushing)pull()});
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
